<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>練習用</title>
    <style>
      h1 {
        color: #ff5376;
      }
      body {
        background-color: #f5f5f5;
      }

      .btn {
            display: inline-block;        
            background-color: #ff5376;    
            color: white;                 
            padding: 10px 20px;           
            text-decoration: none;        
            border-radius: 20px;          
            font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>練習中です</h1>
    <p>よろしくお願いします</p>
    <ul>
      <li>ゲーム</li>
      <li>寝ること</li>
      <li>食べること</li>
    </ul>
    <p>
      <a href="https://www.youtube.com/" target="_blank"　class="btn">youtueはここだ！</a>
    </p>
  </body>
</html>
